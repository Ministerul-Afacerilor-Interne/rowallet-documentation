  - 2. Architecture:
    - "architecture-concept/02-architecture/01-decomposition.md"
    - "architecture-concept/02-architecture/02-data-register.md"
    - "architecture-concept/02-architecture/03-cryptography.md"
    - "architecture-concept/02-architecture/04-communication-channels.md"
    - "architecture-concept/02-architecture/05-mobile-devices.md"
  - 3. Data Flows:
    - 3.1. Wallet Lifecycle:
      - "architecture-concept/03-data-flows/11-wallet-activation.md"
      - "architecture-concept/03-data-flows/12-wallet-dashboard.md"
      - "architecture-concept/03-data-flows/13-wallet-revocation.md"
      - "architecture-concept/03-data-flows/14-wallet-deletion.md"
    - 3.2. PID Lifecycle:
      - "architecture-concept/03-data-flows/21-pid-issuance.md"
      - "architecture-concept/03-data-flows/22-pid-presentation.md"
      - "architecture-concept/03-data-flows/23-pid-deletion.md"
    - 3.3. EAA Lifecycle:
      - "architecture-concept/03-data-flows/31-eaa-issuance.md"
      - "architecture-concept/03-data-flows/32-eaa-presentation.md"
      - "architecture-concept/03-data-flows/33-eaa-deletion.md"
  - 4. Wallet Backend: "architecture-concept/04-wallet-backend/01-wallet-backend.md"
  - 5. Remote WSCA: "architecture-concept/05-remote-wsca/01-remote-wsca.md"
  - 6. MDVM: "architecture-concept/06-mdvm/01-mdvm.md"
  - 7. Push Notification Service: "architecture-concept/07-push-notification-service/01-push-notification-service.md"
  - 8. Message Queue: "architecture-concept/08-message-queue/01-message-queue.md"
  - 9. UI/UX: "architecture-concept/09-ui-ux/00-index.md"
  